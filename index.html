<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Electricity Usage Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>⚡ Electricity Usage Dashboard</h1>
</header>

<div class="container">

  <!-- Summary Cards -->
  <div class="cards">
    <div class="card">
      <h3>Total Users</h3>
      <p id="totalUsers">–</p>
    </div>
    <div class="card">
      <h3>Total Consumption (kWh)</h3>
      <p id="totalKwh">–</p>
    </div>
    <div class="card">
      <h3>Average per User (kWh)</h3>
      <p id="avgKwh">–</p>
    </div>
  </div>

  <div class="grid">
    <!-- Chart -->
    <canvas id="usageChart"></canvas>

    <!-- Province Table -->
    <table>
      <thead>
        <tr>
          <th>Province</th>
          <th>Usage (kWh)</th>
          <th>Number of People</th>
          <th>Usage / Person (kWh)</th>
        </tr>
      </thead>
      <tbody id="usersTable"></tbody>
    </table>
  </div>
</div>

<script>
async function loadData() {
  const usageRes = await fetch('electricity_usages_en.json');
  const usersRes = await fetch('electricity_users_en.json');

  const usageJson = await usageRes.json();
  const usersJson = await usersRes.json();

  // Usage file is wrapped in "Sheet1"
  const usages = usageJson.Sheet1;
  const users = usersJson;

  // ===== USERS PER PROVINCE =====
  const userMap = {};
  users.forEach(p => {
    let total = 0;
    Object.keys(p).forEach(k => {
      if (k.endsWith('_count')) {
        total += Number(p[k] || 0);
      }
    });
    userMap[p.province_name] = total;
  });

  // ===== PROVINCE METRICS =====
  const provinces = [];
  let totalKwh = 0;
  let totalUsers = 0;

  usages.forEach(p => {
    let provinceKwh = 0;
    Object.keys(p).forEach(k => {
      if (k.endsWith('_kwh')) {
        provinceKwh += Number(p[k] || 0);
      }
    });

    const provinceUsers = userMap[p.province_name] || 0;

    provinces.push({
      name: p.province_name,
      kwh: provinceKwh,
      users: provinceUsers,
      perPerson: provinceUsers ? provinceKwh / provinceUsers : 0
    });

    totalKwh += provinceKwh;
    totalUsers += provinceUsers;
  });

  // ===== SUMMARY =====
  document.getElementById('totalUsers').textContent =
    totalUsers.toLocaleString();

  document.getElementById('totalKwh').textContent =
    totalKwh.toLocaleString();

  document.getElementById('avgKwh').textContent =
    totalUsers ? (totalKwh / totalUsers).toFixed(2) : 0;

  // ===== TABLE =====
  const table = document.getElementById('usersTable');
  table.innerHTML = '';

  provinces.forEach(p => {
    table.innerHTML += `
      <tr>
        <td>${p.name}</td>
        <td>${p.kwh.toLocaleString()}</td>
        <td>${p.users.toLocaleString()}</td>
        <td>${p.perPerson.toFixed(2)}</td>
      </tr>
    `;
  });

  // ===== BAR CHART =====
  new Chart(document.getElementById('usageChart'), {
    type: 'bar',
    data: {
      labels: provinces.map(p => p.name),
      datasets: [{
        label: 'Electricity Usage (kWh)',
        data: provinces.map(p => p.kwh)
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false }
      },
      scales: {
        y: {
          ticks: {
            callback: value => value.toLocaleString()
          }
        }
      }
    }
  });
}

loadData();
</script>

</body>
</html>
